<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real mark. This was a placeholder purple circle with an O in it. -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organiflo — Your Organic Social Growth Engine</title>
    
    <!-- Open Graph / Social Meta Tags -->
    <meta property="og:title" content="Organiflo" />
    <meta property="og:description" content="Automate your organic social media and email marketing with AI. Set it and forget it." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://organic-marketing-ai.vercel.app/" />
    <!-- Without an og:image a shared link renders as a bare grey card, which
         matters most on the channel this product is about. -->
    <meta property="og:image" content="https://organic-marketing-ai.vercel.app/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Organiflo" />
    <meta name="twitter:description" content="Automate your organic social media and email marketing with AI." />
    <meta name="twitter:image" content="https://organic-marketing-ai.vercel.app/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter was loaded here and is no longer used anywhere: the type is now
         Bricolage Grotesque and Manrope, imported once in index.css. Leaving
         this in downloaded a whole unused family on first paint. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
